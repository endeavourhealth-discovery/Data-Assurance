version: 0.2

phases:
#  install:
#    commands:
#      - apt-get -y update
#      - apt-get -y install chromium-browser
#      - apt-get -y install xvfb
#      - Xvfb :99 &
#      - export DISPLAY=:99
#      - export CHROME_BIN=/usr/bin/chromium-browser
  pre_build:
    commands:
      - IP=$(curl http://checkip.amazonaws.com)/32
      - echo $IP of CodeBuild Instance
      - aws s3 cp s3://endeavour-codebuild/settings/settings.xml /root/.m2/settings.xml
  build:
    commands:
      - echo Build started on `date`
      - chmod +x aws_scripts/build.sh
      - aws_scripts/build.sh mvn -B package
  post_build:
    commands:
      - IP=$(curl http://checkip.amazonaws.com)/32
      - echo $IP of CodeBuild Instance
      - echo Build completed on `date`
artifacts:
  files:
    - appspec.yml
    - aws_scripts/**/*
    - API/target/API-1.0-SNAPSHOT/**/*
    - FrontEnd/dist/**/*
